<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="paper" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#F3F0E8"/>
      <rect width="1" height="1" fill="#EFEBE2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect x="72" y="56" width="48" height="3" fill="#C45C26"/>
  <text x="72" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#1A2330" letter-spacing="3">SADAKSAARTHI</text>
  <text x="72" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="3.2">BEL SIH 26124  ·  PUBLIC TRANSPORT AS A SENSING FLEET</text>
  <text x="1848" y="108" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8175" letter-spacing="2.4">ONE STILL IS NOT A CITY FACT</text>
  <line x1="72" y1="168" x2="1848" y2="168" stroke="#1F3A5F" stroke-width="1"/>

  <!-- connecting rail -->
  <line x1="280" y1="470" x2="1640" y2="470" stroke="#1F3A5F" stroke-width="1.25"/>
  <polygon points="508,470 492,462 492,478" fill="#1F3A5F"/>
  <polygon points="980,470 964,462 964,478" fill="#1F3A5F"/>
  <polygon points="1452,470 1436,462 1436,478" fill="#1F3A5F"/>

  <!-- PANEL 1 -->
  <g>
    <rect x="88" y="220" width="384" height="500" fill="#FBFAF6" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="112" y="268" font-family="Georgia, serif" font-size="13" fill="#C45C26" letter-spacing="3">01</text>
    <!-- phone icon -->
    <rect x="248" y="300" width="64" height="108" rx="8" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="260" y="316" width="40" height="68" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <circle cx="280" cy="396" r="4" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="280" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1A2330">Phone</text>
    <text x="280" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="1.5">/FIELD  ·  GPS  ·  STILL</text>
    <line x1="160" y1="520" x2="400" y2="520" stroke="#D9D2C5" stroke-width="1"/>
    <text x="280" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Windshield browser. PIN from desk.</text>
    <text x="280" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">On-phone boxes are a preview.</text>
    <text x="280" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">The photo is the official ticket.</text>
  </g>

  <!-- PANEL 2 -->
  <g>
    <rect x="560" y="220" width="384" height="500" fill="#FBFAF6" stroke="#1F3A5F" stroke-width="1.5"/>
    <rect x="560" y="220" width="384" height="6" fill="#C45C26"/>
    <text x="584" y="268" font-family="Georgia, serif" font-size="13" fill="#C45C26" letter-spacing="3">02</text>
    <ellipse cx="752" cy="348" rx="54" ry="22" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="716" y="348" width="72" height="52" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <line x1="732" y1="366" x2="772" y2="366" stroke="#1F3A5F" stroke-width="1.5"/>
    <line x1="732" y1="380" x2="760" y2="380" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="752" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1A2330">Azure</text>
    <text x="752" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="1.5">FASTAPI  ·  YOLO CPU</text>
    <line x1="632" y1="520" x2="872" y2="520" stroke="#D9D2C5" stroke-width="1"/>
    <text x="752" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Ingest. Detect. Fuse the folio.</text>
    <text x="752" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Second bus, 40 m / 6 h, confirms.</text>
    <text x="752" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Same bus cannot confirm itself.</text>
  </g>

  <!-- PANEL 3 -->
  <g>
    <rect x="1032" y="220" width="384" height="500" fill="#FBFAF6" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1056" y="268" font-family="Georgia, serif" font-size="13" fill="#C45C26" letter-spacing="3">03</text>
    <ellipse cx="1224" cy="328" rx="40" ry="14" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <path d="M1184 328 V380 C1184 388 1200 394 1224 394 C1248 394 1264 388 1264 380 V328" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="1288" y="336" width="44" height="52" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <line x1="1298" y1="352" x2="1322" y2="352" stroke="#1F3A5F" stroke-width="1.5"/>
    <line x1="1298" y1="366" x2="1316" y2="366" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1224" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1A2330">Store</text>
    <text x="1224" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="1.5">POSTGRES  ·  BLOB</text>
    <line x1="1104" y1="520" x2="1344" y2="520" stroke="#D9D2C5" stroke-width="1"/>
    <text x="1224" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Events, buses, work orders.</text>
    <text x="1224" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Stills live in Blob, not the table.</text>
    <text x="1224" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">REAL / RULE / SEED stays honest.</text>
  </g>

  <!-- PANEL 4 -->
  <g>
    <rect x="1504" y="220" width="328" height="500" fill="#FBFAF6" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1528" y="268" font-family="Georgia, serif" font-size="13" fill="#C45C26" letter-spacing="3">04</text>
    <rect x="1618" y="304" width="100" height="72" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <circle cx="1648" cy="336" r="8" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <circle cx="1688" cy="348" r="5" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <path d="M1648 344 L1668 360 L1684 350" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <rect x="1610" y="384" width="116" height="10" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1668" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1A2330">ICCC</text>
    <text x="1668" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="1.5">REACT DESK</text>
    <line x1="1568" y1="520" x2="1768" y2="520" stroke="#D9D2C5" stroke-width="1"/>
    <text x="1668" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Officer map and folio.</text>
    <text x="1668" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Verify, then send to ward.</text>
    <text x="1668" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D3830">Phone token cannot open this.</text>
  </g>

  <rect x="88" y="760" width="1744" height="72" fill="#1F3A5F"/>
  <text x="960" y="806" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F6F1E8" letter-spacing="1.5">See  ·  Fuse  ·  Second bus confirms  ·  Assign work  ·  Drive again</text>

  <text x="88" y="892" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8A8175" letter-spacing="2">LIVE PATH ONLY</text>
  <text x="88" y="928" font-family="Georgia, serif" font-size="18" fill="#3D3830">No Flutter detector. No MQTT. No CCTV wall. Overlay is preview. Official still is YOLOv8s India RDD on Azure CPU.</text>
  <text x="88" y="968" font-family="Georgia, serif" font-size="18" fill="#3D3830">Held-out mAP@0.5 = 0.6189. Gmail fires only after FLEET_CONFIRMED. Mail is not vision.</text>
</svg>
