<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460" role="img" aria-labelledby="title desc">
  <title id="title">SadakSaarthi — every bus is a road scanner</title>
  <desc id="desc">A cream banner with the SadakSaarthi wordmark, the line “Every bus is a road scanner. Every ticket needs a second witness.”, and a stylised bus route with a pothole and a second-bus confirmation.</desc>
  <defs>
    <pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F4F0E6"/>
      <rect width="1" height="1" fill="#EDE7DA" opacity="0.75"/>
    </pattern>
  </defs>

  <rect width="1600" height="460" fill="url(#paper)"/>
  <rect x="0" y="0" width="1600" height="4" fill="#C45C26"/>
  <rect x="0" y="396" width="1600" height="64" fill="#1F3A5F"/>

  <!-- masthead -->
  <rect x="78" y="72" width="46" height="3" fill="#C45C26"/>
  <text x="78" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="3.2">SIH 2026 · BEL PROBLEM STATEMENT 26124 · DELHI ICCC</text>
  <text x="78" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#16283F" letter-spacing="3">SADAKSAARTHI</text>
  <text x="78" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#26384E">Every bus is a road scanner.</text>
  <text x="78" y="313" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#C45C26">Every ticket needs a second witness.</text>
  <text x="78" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6B6458" letter-spacing="1.4">PUBLIC TRANSPORT AS A SENSING FLEET · ONE EVENT · ONE STILL · NO VIDEO STREAM</text>

  <!-- route panel -->
  <rect x="1018" y="58" width="506" height="300" rx="2" fill="#FBF8F0" stroke="#D7CEBD"/>
  <text x="1046" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8A8175" letter-spacing="2.4">CONFIRMATION LEDGER</text>
  <line x1="1046" y1="103" x2="1496" y2="103" stroke="#E3DACA"/>

  <!-- road -->
  <path d="M1046 322 C1120 260 1170 236 1240 220 C1310 204 1370 178 1460 132" fill="none" stroke="#1F3A5F" stroke-width="38" stroke-linecap="round"/>
  <path d="M1046 322 C1120 260 1170 236 1240 220 C1310 204 1370 178 1460 132" fill="none" stroke="#F4F0E6" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round" opacity="0.9"/>

  <!-- bus 1 -->
  <g transform="translate(1084 250) rotate(-22)">
    <rect x="0" y="0" width="94" height="40" rx="6" fill="#1F3A5F"/>
    <rect x="8" y="6" width="18" height="13" rx="2" fill="#F4F0E6"/>
    <rect x="31" y="6" width="18" height="13" rx="2" fill="#F4F0E6"/>
    <rect x="54" y="6" width="18" height="13" rx="2" fill="#F4F0E6"/>
    <rect x="77" y="6" width="9" height="13" rx="2" fill="#C45C26"/>
    <circle cx="20" cy="42" r="7" fill="#16283F"/>
    <circle cx="74" cy="42" r="7" fill="#16283F"/>
  </g>
  <text x="1042" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#C45C26" letter-spacing="1.4">1ST SIGHTING</text>

  <!-- pothole -->
  <ellipse cx="1392" cy="168" rx="33" ry="20" fill="#2A2A2A"/>
  <ellipse cx="1392" cy="168" rx="33" ry="20" fill="none" stroke="#C45C26" stroke-width="2"/>
  <path d="M1368 158 L1383 168 L1374 176 M1402 154 L1396 168 L1418 174 M1386 180 L1392 190" fill="none" stroke="#C45C26" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="1392" cy="168" r="52" fill="none" stroke="#C45C26" stroke-width="1" stroke-dasharray="4 6" opacity="0.75"/>
  <text x="1352" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B6458" letter-spacing="1.4">D40 · POTHOLE</text>

  <!-- bus 2 + confirm -->
  <g transform="translate(1180 296)">
    <rect x="0" y="0" width="80" height="34" rx="5" fill="#315A3E"/>
    <rect x="7" y="5" width="15" height="11" rx="2" fill="#F4F0E6"/>
    <rect x="27" y="5" width="15" height="11" rx="2" fill="#F4F0E6"/>
    <rect x="47" y="5" width="15" height="11" rx="2" fill="#F4F0E6"/>
    <circle cx="17" cy="36" r="6" fill="#16283F"/>
    <circle cx="63" cy="36" r="6" fill="#16283F"/>
  </g>
  <circle cx="1284" cy="286" r="15" fill="#315A3E"/>
  <path d="M1276 286 L1282 292 L1293 279" fill="none" stroke="#F4F0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1306" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#315A3E" letter-spacing="1.4">2ND BUS CONFIRMS</text>

  <!-- ledger rows -->
  <line x1="1046" y1="336" x2="1496" y2="336" stroke="#E3DACA"/>
  <text x="1046" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8A8175" letter-spacing="1.2">40 M · 6 H · INDEPENDENT SOURCE</text>
  <text x="1496" y="354" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8A8175" letter-spacing="1.2">ONE BUS CANNOT SELF-CONFIRM</text>

  <!-- footer -->
  <text x="78" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#F4F0E6" letter-spacing="2.2">SEE  →  FUSE  →  CONFIRM  →  ASSIGN  →  RE-SENSE</text>
  <text x="1522" y="435" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C9D2DD" letter-spacing="1.6">NO CONTINUOUS VIDEO</text>
</svg>
